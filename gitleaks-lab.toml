title = "Peraturan tambahan bengkel"

[extend]
useDefault = true

[[rules]]
id = "k8s-env-secret"
description = "Pemboleh ubah env K8s yang namanya mengandungi secret/password/key dengan nilai tetap"
regex = '''(?i)name:\s*["']?[\w.-]*(?:secret|password|passwd|api_?key|token)[\w.-]*["']?\s*\n\s*value:\s*["']?([A-Za-z0-9_\-/+=.]{12,})["']?'''
secretGroup = 1
path = '''\.ya?ml$'''
keywords = ["value"]